name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: Package or plugin version, Tilr version, macOS / Node version if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Error messages, console output. Remove anything private (tokens, paths, names).
      render: text
