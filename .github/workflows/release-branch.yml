name: release-branch

on:
  workflow_call:
    inputs:
      workflow-sha:
        description: Immutable tilr-dev/.github commit, identical to the caller's uses pin
        required: true
        type: string
      app-client-id:
        description: tilr-bot GitHub App client ID
        required: true
        type: string
    secrets:
      app-private-key:
        description: tilr-bot private key for a repository-scoped installation token
        required: true
    outputs:
      tag:
        description: Stable or candidate tag, empty when nothing should be built
        value: ${{ jobs.release.outputs.tag }}
      version:
        description: Selected tag without the v prefix
        value: ${{ jobs.release.outputs.version }}
      is_rc:
        description: True only when a candidate was selected
        value: ${{ jobs.release.outputs.is_rc }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: shared-release-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      is_rc: ${{ steps.release.outputs.is_rc }}
    steps:
      - name: Validate event and implementation pin before checkout
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          WORKFLOW_SHA: ${{ inputs.workflow-sha }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          [[ $EVENT == push ]] || { echo '::error::release workflow requires a push event'; exit 1; }
          if [[ $REF_TYPE == branch ]]; then
            [[ $REF_NAME =~ ^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo '::error::release branches are named release/X.Y'; exit 1; }
          elif [[ $REF_TYPE != tag || ! $REF_NAME =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::stable tags are named vX.Y.Z'
            exit 1
          fi
          [[ $WORKFLOW_SHA =~ ^[0-9a-f]{40}$ ]] || { echo '::error::workflow-sha must be an immutable commit'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: caller
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tilr-dev/.github
          ref: ${{ inputs.workflow-sha }}
          persist-credentials: false
          path: shared
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - id: release
        name: Select metadata and publish GitHub release
        working-directory: caller
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ inputs.workflow-sha }}
          SHA: ${{ github.sha }}
        run: node ../shared/.github/release/release.cjs
